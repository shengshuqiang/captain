<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      href="./favicon.ico"
      type="image/x-icon"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>算算乐</title>
    <style>
      html {
        /* 设置rem基准单位，相对于 750px 宽度手机 */
        font-size: calc(100vw / 7.5);
        height: 100%;
        width: 100%;
      }
      body {
        margin: 0;
      }
      .swal2-popup {
        /* swal2 里面通过 em 设置大小，必须重置回去 */
        font-size: 16px !important;
      }

      /* 仅收敛算算乐设置弹窗，避免影响同页其他 SweetAlert2 提示。 */
      .suansuanle-settings-popup {
        width: min(320px, calc(100vw - 40px)) !important;
        padding: 0 0 18px !important;
        font-size: 14px !important;
      }

      .suansuanle-settings-popup .swal2-icon {
        width: 56px !important;
        height: 56px !important;
        margin: 20px auto 8px !important;
        border-width: 3px !important;
      }

      .suansuanle-settings-popup .swal2-icon .swal2-icon-content {
        font-size: 40px !important;
      }

      .suansuanle-settings-popup .swal2-title {
        padding: 0 20px !important;
        font-size: 24px !important;
        line-height: 1.2 !important;
      }

      .suansuanle-settings-popup .swal2-html-container {
        margin: 14px 18px 0 !important;
        font-size: 15px !important;
      }

      .suansuanle-settings-popup .swal2-radio {
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }

      .suansuanle-settings-popup .swal2-radio label {
        display: inline-flex !important;
        align-items: center;
        white-space: nowrap;
        margin: 0 2px !important;
        font-size: 15px !important;
      }

      .suansuanle-settings-popup .swal2-radio input {
        margin-right: 6px !important;
      }

      .suansuanle-settings-popup .swal2-select {
        min-width: 168px !important;
        margin: 12px auto 2px !important;
        font-size: 15px !important;
      }

      .suansuanle-settings-popup .swal2-actions {
        margin-top: 16px !important;
      }

      .suansuanle-settings-popup .swal2-styled.swal2-confirm {
        padding: 10px 26px !important;
        font-size: 16px !important;
      }
    </style>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
    <link rel="stylesheet" href="./src/styles.css" />
    <script type="module" src="./src/main.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>

ext {
    // GSY/Media3 的 API 36 要求由所有 Android 模块共享。
    captainCompileSdk = 36
    // The embedded browser's build information describes its Captain host.
    captainMinSdk = 23
    captainVersionCode = 100010200
    captainVersionName = '1.1.200'
    // A side-by-side package is used for browser acceptance; the normal app ID stays unchanged.
    captainBrowserTestEnabled = project.findProperty('captainBrowserTest') == 'true'
    captainApplicationId = 'com.shuqiang.captain' +
            (captainBrowserTestEnabled ? '.browser.test' : '')
    cfgs = [
            versionCode                   : 91,
            versionName                   : "v3.11.1",

            //open version control
            androidSupportVersion         : "27.0.2",
            version_recyclerview          : "1.2.1",
            version_appcompat             : "1.3.1",
            activity_version              : "1.3.1",
            fragment_version              : "1.3.1",
            viewpage2                     : "1.0.0",
            constraintlayout              : "2.1.4",
            exoplayer                     : "2.18.0",
            transition                    : "1.4.1",
            okhttp                        : "3.12.13",
            gson                          : "2.8.6",
            futures                       : "1.1.0",

            experimental_version          : "1.1.0",
            futures_version               : "1.1.0",

            exifinterface_version         : "1.3.3",

            // glide
            glide_version                 : "4.15.1",

            // picasso
            picasso_version               : "2.71828",

            // coil
            coil_version                  : "2.1.0"

    ]
}

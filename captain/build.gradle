import java.io.FileInputStream
import java.util.Properties

apply plugin: 'com.android.application'

// Load local release signing config without committing secrets.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
def hasReleaseSigning = keystorePropertiesFile.exists()
if (hasReleaseSigning) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'captain'
    // Existing QR tooling reads BuildConfig; AGP 8 disables generation by default.
    buildFeatures {
        buildConfig = true
    }
//    将gradle中的编译环境，SDK的版本号修改到29以下, 解决Android 10.0后创建文件createNewFile()和创建文件夹mkdirs()均失败解决方案
//    https://cloud.tencent.com/developer/article/1914736
//    ndkVersion "22.1.7171670"
    compileSdkVersion rootProject.ext.captainCompileSdk
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }
    defaultConfig {
        minSdkVersion 23
        targetSdkVersion 29
        versionCode 100010200
        versionName "1.1.200"
        applicationId "com.shuqiang.captain"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
    compileOptions {
        sourceCompatibility 1.8
        targetCompatibility 1.8
    }
}

// Preserve unrelated legacy resolutions while allowing GSY's AndroidX requirements.
def gsyPlayerVersion = '14.0.0'
def legacyConstraintLayout = 'androidx.constraintlayout:constraintlayout:1.1.3'
def legacyGson = 'com.google.code.gson:gson:2.8.2'
configurations.configureEach {
    resolutionStrategy.force legacyConstraintLayout, legacyGson
}

dependencies {
    // Keep the existing speech runtime and JNA packaging unchanged.
    implementation 'com.alphacephei:vosk-android:0.3.75@aar'
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation project(path: ':base')
    implementation project(path: ':toolbox')
    implementation project(path: ':pictureselector')
    implementation project(path: ':zxing')
    implementation project(path: ':popupwindow')
    // 经典首页 4 tab 导航
    implementation project(':navigationtabbar')
    implementation 'com.facebook.conceal:conceal:2.0.2@aar'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.0.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.0.0'
    implementation 'androidx.navigation:n' +
            'avigation-fragment:2.0.0'
    implementation 'androidx.navigation:navigation-ui:2.0.0'
    implementation('androidx.appcompat:appcompat:1.0.0')
    implementation legacyConstraintLayout
    implementation('com.google.android.material:material:1.0.0')
    implementation legacyGson
    implementation('androidx.fragment:fragment:1.3.6')
    implementation('androidx.vectordrawable:vectordrawable-animated:1.1.0')
    implementation('androidx.recyclerview:recyclerview:1.2.1')
    implementation('androidx.activity:activity:1.3.1')
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation "com.squareup.okhttp3:okhttp:${rootProject.ext.cfgs.okhttp}"
    implementation 'org.jsoup:jsoup:1.17.2'
    implementation "com.github.bumptech.glide:glide:${rootProject.ext.cfgs.glide_version}"
    // GSY supplies controls; Media3 uses the preview session data source.
    implementation "io.github.carguo:gsyvideoplayer-java:${gsyPlayerVersion}"
    implementation("io.github.carguo:gsyvideoplayer-exo2:${gsyPlayerVersion}") {
        exclude group: 'androidx.media3', module: 'media3-cast'
    }
    implementation 'androidx.media3:media3-datasource-okhttp:1.10.1'
    implementation 'com.github.bhlangonijr:chesslib:1.3.4'
//    implementation 'com.google.zxing:core:3.2.1'
    implementation project(path: ':zxing-core')

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
}

configurations {
//    all*.exclude group: 'com.android.support', module: 'design'

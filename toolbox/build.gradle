apply plugin: 'com.android.library'

android {
    namespace 'com.shuqiang.toolbox'
    compileSdkVersion rootProject.ext.captainCompileSdk
    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 31
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    api('androidx.core:core:1.3.2')
}
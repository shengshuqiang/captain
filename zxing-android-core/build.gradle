apply plugin: 'com.android.library'

android {
    namespace 'com.google.zxing.client.android.camera'
    compileSdkVersion rootProject.ext.captainCompileSdk

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}

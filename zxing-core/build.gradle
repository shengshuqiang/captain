apply plugin: 'com.android.library'

android {
    namespace 'com.google.zxing'
    compileSdkVersion rootProject.ext.captainCompileSdk

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 30
    }

    buildTypes {
        release {
            minifyEnabled false
